six_motor_manual_controller:
  ros__parameters:
    # Topics
    wheel_command_topic: /wheel_effort_controller/commands
    leg_command_topic: /leg_effort_controller/commands
    joint_state_topic: /joint_states
    odom_topic: /base_odom

    # Timing and safety
    publish_rate: 100.0
    deadman_timeout: 0.70
    joint_state_timeout: 0.30
    odom_timeout: 0.30
    start_delay: 0.50
    fall_angle_deg: 70.0
    status_period: 0.20
    pitch_zero_mode: world
    pitch_zero_deg: 0.0

    # W/S target vehicle speed
    command_speed: 0.8
    speed_step: 0.02
    max_target_speed: 0.25
    target_speed_slew_rate: 2.40
    target_speed_epsilon: 0.002

    # Vehicle-speed reference -> body-pitch reference
    speed_to_pitch_gain: 0.60
    speed_to_pitch_ff_gain: 0.30
    max_pitch_ref_deg: 4.0
    pitch_ref_sign: 1.0

    # Synchronous leg lean + wheel drive
    drive_mode: leg_lean_assist

    # Leg-generated pitch
    leg_lean_pitch_ff_gain: 0.40
    leg_lean_gain: 0.30
    leg_lean_rate_gain: 0.02
    max_leg_lean_offset: 0.04

    # STOP-state body pitch hold. This keeps the body close to theta_ref=0
    # using a small leg lean correction without changing the W/S gains.
    stand_pitch_hold_enabled: true
    stand_pitch_deadband_deg: 0.3
    stand_lean_gain: 0.90
    stand_lean_rate_gain: 0.2
    max_stand_lean_offset: 0.03
    stand_lean_effort_gain: 8.0
    stand_lean_effort_rate_gain: 0.15
    max_stand_lean_effort: 0.80

    # Initial geometry candidate: all four signs equal.
    leg_lean_j1: -1.0
    leg_lean_j2: -1.0
    leg_lean_j3: -1.0
    leg_lean_j4: -1.0

    # Keep direct leg-torque feedforward disabled initially.
    pitch_error_deadband_deg: 1.0
    leg_lean_effort_gain: 0.0
    max_leg_lean_effort: 0.0

    # Wheel control in leg_lean_assist mode.
    #
    # With the corrected code all terms use:
    #   pitch_ref - theta
    #   velocity_ref - velocity
    # so feedback and feedforward reinforce rather than cancel.
    wheel_assist_pitch_kp: 0.40
    wheel_assist_pitch_kd: 0.12
    wheel_assist_velocity_kd: 0.60
    wheel_speed_ff_gain: 1.00
    max_wheel_assist_torque: 0.30
    stand_wheel_balance_enabled: true
    stand_wheel_balance_kp: 3.0
    stand_wheel_balance_kd: 0.35
    stand_wheel_velocity_kd: 0.80
    max_stand_wheel_torque: 0.80

    # wheel_balance mode
    balance_kp: 2.0
    balance_kd: 0.10
    velocity_kd: 0.60
    position_hold_kp: 0.0

    # Direction calibration
    balance_sign: 1.0
    pitch_sign: 1.0
    forward_sign: 1.0
    turn_sign: 1.0

    # Start with command-space signs unchanged:
    # W -> positive wheel command, S -> negative wheel command.
    # Flip both together only if Gazebo moves in the opposite direction.
    wheel1_sign: 1.0
    wheel2_sign: 1.0

    # Steering and torque limits
    turn_torque: 0.0
    turn_torque_step: 0.02
    max_turn_torque: 0.15
    max_wheel_torque: 0.80

    # Base leg posture
    j1: 0.3
    j2: -0.3
    j3: 0.3
    j4: -0.3

    # Leg PD
    leg_kp: 0.5
    leg_kd: 0.05
    max_leg_effort: 2.0
    leg_target_slew_rate: 2.90
    leg_extension_step: 0.01
    max_leg_extension_offset: 0.20
