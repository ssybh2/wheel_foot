six_motor_manual_controller:
  ros__parameters:
    publish_rate: 100.0
    deadman_timeout: 0.70
    joint_state_timeout: 0.30

    # Wheel effort commands, N*m per wheel
    drive_torque: 0.10
    turn_torque: 0.08
    wheel_torque_step: 0.02
    max_wheel_torque: 0.50

    # Direction calibration
    wheel1_sign: 1.0
    wheel2_sign: 1.0
    forward_sign: 1.0
    turn_sign: 1.0

    # Calibrated leg targets, rad
    j1: 0.15
    j2: -0.15
    j3: 0.15
    j4: -0.15

    # Leg PD
    leg_kp: 0.5
    leg_kd: 0.05
    max_leg_effort: 2.0

    # Smooth leg target management
    start_delay: 0.50
    leg_target_slew_rate: 0.30
    leg_extension_step: 0.01
    max_leg_extension_offset: 0.20
